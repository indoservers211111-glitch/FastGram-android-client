name: Build FastGram APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK tools
        run: |
          sdkmanager "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Grant permission to Gradle
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew :TMessagesProj_AppStandalone:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastGram-debug-apk
          path: TMessagesProj_AppStandalone/build/outputs/apk/debug/*.apk
          if-no-files-found: error
