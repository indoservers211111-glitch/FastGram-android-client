name: Build FastGram APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare signing key
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkeypair \
            -v \
            -keystore TMessagesProj/config/release.keystore \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=FastGram, OU=FastGram, O=FastGram, L=Yerevan, ST=Yerevan, C=AM"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastGram-debug-apk
          path: TMessagesProj_AppStandalone/build/outputs/apk/debug/*.apk
